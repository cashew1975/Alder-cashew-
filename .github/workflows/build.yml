# Bygger Alder+ på GitHub, så att ingen Android-SDK behövs lokalt.
#
# - Push till main / pull request: bygger en APK och sparar den som artifact (Actions-fliken → körningen → Artifacts).
# - Release, två sätt:
#     * Actions → Build → Run workflow → fyll i version (t.ex. 1.3). Flödet skapar själv taggen v1.3.
#     * eller pusha en tagg v* (t.ex. git tag v1.3 && git push origin v1.3).
#   Båda bygger en signerad APK och lägger upp den som GitHub-release. Appens inbyggda uppdatering
#   (Updates.kt) hittar den där och erbjuder den på TV:n.
#
# Signering: release-körningar går genom miljön "release", där du godkänner varje körning och där de fyra
# nyckel-secrets ligger (se docs/FORK.md). Testbyggen rör aldrig nyckeln och signeras med debug-nyckeln.
# En release vägrar byggas osignerad: den skulle inte gå att installera över en riktig.
#
# Alla actions är låsta till en commit (SHA) så att en kapad tagg hos en tredjepart inte kan byta kod under oss.
# Dependabot (.github/dependabot.yml) föreslår uppdateringar.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Släpp som release med denna version, t.ex. 1.3 (tomt = bara testbygge)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    # Låst version: ubuntu-latest flyttar till Ubuntu 26 hösten 2026, och 24.04 har Android SDK förinstallerat.
    runs-on: ubuntu-24.04
    # Bara releaser går genom miljön med godkännande och nyckeln; tomt namn = ingen miljö för testbyggen.
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.version != '') && 'release' || '' }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
      VERSION_INPUT: ${{ inputs.version }}
    steps:
      # Avgör om körningen är en release, och med vilken tagg: en pushad v*-tagg, eller versionen som skrevs in
      # vid Run workflow. Inmatningen läses via en miljövariabel och kontrolleras, så den inte kan injicera kommandon.
      - name: Release eller testbygge
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "$VERSION_INPUT" ]; then
            if ! [[ "$VERSION_INPUT" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
              echo "::error::Versionen ska se ut som 1.3 eller 1.3.1, inte '$VERSION_INPUT'."; exit 1
            fi
            TAG="v$VERSION_INPUT"
          else
            TAG=""
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "IS_RELEASE=$([ -n "$TAG" ] && echo true || echo false)" >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      # Använder runnerns förinstallerade SDK, eller hämtar kommandoradsverktygen om den saknas.
      # AGP laddar själv ner plattform och build-tools som saknas, så länge licenserna är godkända.
      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/tools.zip -d "$SDK/cmdline-tools" && mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # Cachar Gradle och kontrollerar att gradle-wrapper.jar är en äkta Gradle-release (skydd i leveranskedjan).
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Stoppa osignerad release
        if: env.IS_RELEASE == 'true' && env.HAS_KEY != 'true'
        run: |
          echo "::error::Releaser måste signeras. Lägg in KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS och KEY_PASSWORD som secrets (se docs/FORK.md)."
          exit 1

      # Nyckeln skrivs bara till runnerns temp-katalog och finns aldrig i repot.
      - name: Packa upp signeringsnyckeln
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # Releaser får versionen från taggen (v1.2 -> 1.2). versionCode följer körnumret och ökar alltid,
      # vilket Android kräver för att installera en uppdatering över den gamla.
      - name: Sätt version
        id: version
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$IS_RELEASE" = "true" ]; then
            NAME="${TAG#v}"
          else
            NAME="$(grep -oP 'versionName = .*"\K[^"]+' app/build.gradle.kts)-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      # Vid fel lyfts Gradles "What went wrong" och kompileringsfelen upp som annoteringar, så att felet syns
      # direkt på körningens sida (och via API:t) utan att man behöver ladda ner hela loggen.
      - name: Bygg
        run: |
          set -o pipefail
          if ! ./gradlew assembleRelease testDebugUnitTest --stacktrace \
               -PalderVersionName="$VERSION_NAME" -PalderVersionCode="$VERSION_CODE" 2>&1 | tee build.log; then
            set +e +o pipefail  # felrapporteringen får inte själv avbryta när en grep inte hittar något
            grep -E '^e: |FAILED$' build.log | head -8 | while IFS= read -r line; do echo "::error::$line"; done
            WRONG="$(sed -n '/What went wrong/,/Try:/p' build.log | head -25 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            [ -n "$WRONG" ] && echo "::error title=Gradle::$WRONG"
            TAIL="$(grep -v '^\s*at ' build.log | tail -30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Slutet av loggen::$TAIL"
            exit 1
          fi

      - name: Döp APK:n
        run: cp app/build/outputs/apk/release/*.apk AlderPlus.apk

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: AlderPlus-${{ env.VERSION_NAME }}
          path: AlderPlus.apk

  release:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: AlderPlus-*
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Alder+ ${{ needs.build.outputs.tag }}
          files: AlderPlus.apk
          generate_release_notes: true
