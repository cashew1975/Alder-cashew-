# Bygger Alder+ på GitHub, så att ingen Android-SDK behövs lokalt.
#
# - Push till main / pull request: bygger en APK och sparar den som artifact (Actions-fliken → körningen → Artifacts).
# - Tagg v*  (t.ex. v1.2):         bygger en signerad APK och lägger upp den som GitHub-release. Appens
#                                  inbyggda uppdatering (Updates.kt) hittar den där och erbjuder den på TV:n.
#
# Signering sker med fyra repo-secrets, se docs/FORK.md. Utan dem byggs vanliga körningar med debug-nyckeln,
# men en release vägrar: en debug-signerad release skulle inte gå att installera över en riktig.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Låst version: ubuntu-latest flyttar till Ubuntu 26 hösten 2026, och 24.04 har Android SDK förinstallerat.
    runs-on: ubuntu-24.04
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Använder runnerns förinstallerade SDK, eller hämtar kommandoradsverktygen om den saknas.
      # AGP laddar själv ner plattform och build-tools som saknas, så länge licenserna är godkända.
      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/tools.zip -d "$SDK/cmdline-tools" && mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # Cachar Gradle och kontrollerar att gradle-wrapper.jar är en äkta Gradle-release (skydd i leveranskedjan).
      - uses: gradle/actions/setup-gradle@v4

      - name: Stoppa osignerad release
        if: env.IS_RELEASE == 'true' && env.HAS_KEY != 'true'
        run: |
          echo "::error::Releaser måste signeras. Lägg in KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS och KEY_PASSWORD som secrets (se docs/FORK.md)."
          exit 1

      # Nyckeln skrivs bara till runnerns temp-katalog och finns aldrig i repot.
      - name: Packa upp signeringsnyckeln
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # Releaser får versionen från taggen (v1.2 -> 1.2). versionCode följer körnumret och ökar alltid,
      # vilket Android kräver för att installera en uppdatering över den gamla.
      - name: Sätt version
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="$(grep -oP 'versionName = .*"\K[^"]+' app/build.gradle.kts)-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      # Vid fel lyfts Gradles "What went wrong" och kompileringsfelen upp som annoteringar, så att felet syns
      # direkt på körningens sida (och via API:t) utan att man behöver ladda ner hela loggen.
      - name: Bygg
        run: |
          set -o pipefail
          if ! ./gradlew assembleRelease testReleaseUnitTest --stacktrace \
               -PalderVersionName="$VERSION_NAME" -PalderVersionCode="$VERSION_CODE" 2>&1 | tee build.log; then
            set +e +o pipefail  # felrapporteringen får inte själv avbryta när en grep inte hittar något
            grep -E '^e: |FAILED$' build.log | head -8 | while IFS= read -r line; do echo "::error::$line"; done
            WRONG="$(sed -n '/What went wrong/,/Try:/p' build.log | head -25 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            [ -n "$WRONG" ] && echo "::error title=Gradle::$WRONG"
            TAIL="$(grep -v '^\s*at ' build.log | tail -30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Slutet av loggen::$TAIL"
            exit 1
          fi

      - name: Döp APK:n
        run: cp app/build/outputs/apk/release/*.apk AlderPlus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AlderPlus-${{ env.VERSION_NAME }}
          path: AlderPlus.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AlderPlus-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: AlderPlus.apk
          generate_release_notes: true
